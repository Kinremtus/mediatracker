# EXAMPLE ONLY -- do not apply this file as-is and never commit real secrets.
#
# The CronJob reads two secrets in namespace `mediatracker`:
#
#   1. db-secret      (already exists in k3s; NOT created by k8s/backup/)
#                     keys: PGUSER, PGDATABASE, PGHOST, PGPORT, PGPASSWORD
#                     (POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB are
#                      accepted as fallbacks by the backup script)
#
#   2. backup-secret  (this file) -- optional keys:
#                     AGE_PUBLIC_KEY          age recipient for encryption
#                     RCLONE_CONFIG_R2_TYPE   "s3"
#                     RCLONE_CONFIG_R2_ACCOUNT  R2 account id
#                     RCLONE_CONFIG_R2_KEY      R2 secret key
#                     RCLONE_CONFIG_R2_ENDPOINT https://<account>.r2.cloudflarestorage.com
#                     RCLONE_CONFIG_R2_BUCKET   bucket name
#
# Create it imperatively so the values never land in git:
#
#   kubectl create secret generic backup-secret -n mediatracker \
#     --from-literal=AGE_PUBLIC_KEY='age1...' \
#     --from-literal=RCLONE_CONFIG_R2_TYPE='s3' \
#     --from-literal=RCLONE_CONFIG_R2_ACCOUNT='<account-id>' \
#     --from-literal=RCLONE_CONFIG_R2_KEY='<secret-key>' \
#     --from-literal=RCLONE_CONFIG_R2_ENDPOINT='https://<account-id>.r2.cloudflarestorage.com' \
#     --from-literal=RCLONE_CONFIG_R2_BUCKET='mediatracker-backups'
#
# or from files (re-apply with `kubectl apply` / `--dry-run=client -o yaml`):
#
#   kubectl create secret generic backup-secret -n mediatracker \
#     --from-file=AGE_PUBLIC_KEY=./age.pub \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Generate an age keypair once, on your workstation:
#   age-keygen -o age-key.txt          # private key (AGE_IDENTITY_FILE for restore)
#   grep 'public key' age-key.txt      # -> AGE_PUBLIC_KEY
#
# Everything below is intentionally commented out. Copy it into a local,
# git-ignored file (or use the kubectl commands above) and fill in real values.
#
# ---
# apiVersion: v1
# kind: Secret
# metadata:
#   name: backup-secret
#   namespace: mediatracker
# type: Opaque
# stringData:
#   AGE_PUBLIC_KEY: "age1REPLACE_WITH_YOUR_PUBLIC_KEY"
#   RCLONE_CONFIG_R2_TYPE: "s3"
#   RCLONE_CONFIG_R2_ACCOUNT: "REPLACE_WITH_R2_ACCOUNT_ID"
#   RCLONE_CONFIG_R2_KEY: "REPLACE_WITH_R2_SECRET_KEY"
#   RCLONE_CONFIG_R2_ENDPOINT: "https://REPLACE_WITH_R2_ACCOUNT_ID.r2.cloudflarestorage.com"
#   RCLONE_CONFIG_R2_BUCKET: "mediatracker-backups"
