apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: mediatracker
spec:
  # Daily at 03:00 cluster-local time.
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: postgres-backup
        spec:
          restartPolicy: OnFailure
          initContainers:
            # The backup PVC is a local-path hostPath volume: kubelet does not
            # chown those for `fsGroup`, so a one-shot root init makes /backups
            # writable for the nonroot backup user. Same image as the job (no
            # extra pull); root only here, with the single CHOWN capability.
            - name: fix-perms
              image: ${BACKUP_IMAGE}
              command: ["sh", "-c", "chown -R 65532:65532 /backups"]
              securityContext:
                runAsUser: 0
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                  add:
                    - CHOWN
              volumeMounts:
                - name: backup-data
                  mountPath: /backups
          containers:
            - name: backup
              # Prebuilt tooling image (Dockerfile.backup): postgres 17 clients,
              # age and rclone are baked in — no `apk add` as root and no
              # writable root filesystem in production. The deploy substitutes
              # the commit-sha tag.
              image: ${BACKUP_IMAGE}
              command: ["/bin/sh", "/scripts/backup.sh"]
              envFrom:
                # Provides POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB; the
                # script maps them onto PGUSER/PGPASSWORD/PGDATABASE.
                - secretRef:
                    name: db-secret
              env:
                # rclone resolves its cache dir through $HOME; /tmp is a tmpfs.
                - name: HOME
                  value: /tmp
                # All backup-secret keys are optional: a missing key just
                # disables that feature (unencrypted dump / no offsite copy).
                - name: AGE_PUBLIC_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: AGE_PUBLIC_KEY
                      optional: true
                - name: RCLONE_CONFIG_R2_TYPE
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: RCLONE_CONFIG_R2_TYPE
                      optional: true
                # rclone's s3 backend authenticates with access_key_id /
                # secret_access_key (the R2 API token pair). The previous
                # RCLONE_CONFIG_R2_ACCOUNT/KEY names set unrelated options, so
                # an enabled offsite upload would have failed authentication.
                - name: RCLONE_CONFIG_R2_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: RCLONE_CONFIG_R2_ACCESS_KEY_ID
                      optional: true
                - name: RCLONE_CONFIG_R2_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: RCLONE_CONFIG_R2_SECRET_ACCESS_KEY
                      optional: true
                - name: RCLONE_CONFIG_R2_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: RCLONE_CONFIG_R2_ENDPOINT
                      optional: true
                - name: RCLONE_CONFIG_R2_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: backup-secret
                      key: RCLONE_CONFIG_R2_BUCKET
                      optional: true
              securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  memory: 64Mi
                  cpu: 50m
                limits:
                  memory: 256Mi
                  cpu: 500m
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: backup-data
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: backup-scripts
                defaultMode: 0555
            - name: backup-data
              persistentVolumeClaim:
                claimName: backup-data
            - name: tmp
              emptyDir: {}
