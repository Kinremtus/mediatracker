apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: mediatracker
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: mediatracker
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # postgres:17-alpine runs as uid/gid 70 (the `postgres` user).
      # fsGroup makes the local-path PVC group-writable for that user.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: db-secret
          # pg_isready exec probes. db-secret exposes PGUSER/PGDATABASE
          # (POSTGRES_USER/POSTGRES_DB are accepted fallbacks) so both names
          # are tried to keep the probe working regardless of the key set.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  pg_isready -U "${POSTGRES_USER:-${PGUSER:-postgres}}"
                  -d "${POSTGRES_DB:-${PGDATABASE:-postgres}}"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  pg_isready -U "${POSTGRES_USER:-${PGUSER:-postgres}}"
                  -d "${POSTGRES_DB:-${PGDATABASE:-postgres}}"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # PGDATA stays on the mounted volume (image default is
            # /var/lib/postgresql/data).
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
        storageClassName: local-path
