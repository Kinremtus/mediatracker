# Namespace-wide guardrails for `mediatracker`.
#
# ResourceQuota caps the aggregate footprint of the namespace. LimitRange
# supplies defaults for containers that omit resources (e.g. one-off debug
# pods, the refresh CronJob) so the quota still applies to them.

apiVersion: v1
kind: ResourceQuota
metadata:
  name: mediatracker-quota
  namespace: mediatracker
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "20"
    persistentvolumeclaims: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: mediatracker-limits
  namespace: mediatracker
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 2Gi
