{% extends "app_shell.html" %}

{% block title %}Календарь - MediaTracker{% endblock %}

{% block content %}
<div class="calendar-page">
  <header class="calendar-header">
    <a href="{{ prev_month_url }}" class="calendar-nav" aria-label="Предыдущий месяц">←</a>
    <h2>{{ month_name }} {{ year }}</h2>
    <a href="{{ next_month_url }}" class="calendar-nav" aria-label="Следующий месяц">→</a>
    <a href="/calendar" class="calendar-today">Сегодня</a>
  </header>

  <div id="calendar-content">
    {% include "partials/calendar_weeks.html" %}
  </div>
</div>
{% endblock %}
