<div class="season-row-header" id="season-header-{{ external_id }}-{{ row.season_number }}">
    <form class="episode-item-form"
          hx-post="/api/tmdb/{{ external_id }}/seasons/{{ row.season_number }}/watched"
          hx-vals='{"watched": {% if row.all_watched %}false{% else %}true{% endif %}}'
          hx-swap="none">
        <button type="submit"
                class="episode-item-checkbox {% if row.all_watched %}episode-item-checkbox--checked{% endif %}"
                title="{% if row.all_watched %}Снять отметку{% else %}Отметить просмотренным{% endif %}">
            {% if row.all_watched %}✓{% else %}○{% endif %}
        </button>
    </form>
    <button class="season-row-toggle" @click="open = !open" type="button">
        <span class="season-row-name">{{ row.name }}</span>
        <span class="season-row-meta">{{ row.watched_count }}/{{ row.episode_count }} эп.</span>
        <span class="drawer-section-arrow" :class="{ 'rotated': open }">▾</span>
    </button>
</div>
