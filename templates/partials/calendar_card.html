<article class="calendar-card{% if event.is_past() %} is-past{% endif %}"
         data-provider="{{ event.provider }}"
         data-external-id="{{ event.external_id }}"
         data-media-type="{{ event.media_type }}"
         onclick="openMediaDrawer(this.dataset.provider, this.dataset.externalId, this.dataset.mediaType)">
  <img class="calendar-card-poster"
       src="{{ event.poster_or_placeholder() }}"
       alt=""
       loading="lazy">
  <div class="calendar-card-body">
    <div class="calendar-card-title">{{ event.title }}</div>
    <div class="calendar-card-meta">
      <span class="badge {% if event.is_episode() %}badge-episode{% else %}badge-premiere{% endif %}">{{ event.label() }}</span>
      {% if event.has_date() %}
        <span class="calendar-card-date">{{ event.date_ru() }}</span>
      {% endif %}
    </div>
  </div>
</article>
