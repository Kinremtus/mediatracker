# Capacity budget (learned the hard way). VPS1 allocates 1 CPU / 2 GiB and
# the kubelet only schedules pods whose CPU *requests* fit. Static load:
# kube-system ~200m + monitoring ~500m. This chart adds postgres 100m +
# refresh 25m + 2 x app 50m = ~925m of 1000m. Crossing that line leaves a
# pod Pending, `helm --atomic` then times out and rolls the whole release
# back - which is exactly how the first attempt at this deploy ended.
# Keep the sum below ~950m, or move monitoring off this node.
# Two replicas keep the app available during rolling updates and node
# drains: with podDisruptionBudget.minAvailable: 1 a single replica
# would block voluntary evictions (kubectl drain) indefinitely.
replicaCount: 2

image:
  repository: ghcr.io/kinremtus/mediatracker
  tag: latest
  # Immutable per-commit tags (CI passes --set image.tag=$GITHUB_SHA), so
  # IfNotPresent is safe and avoids a registry round-trip on every start.
  pullPolicy: IfNotPresent

# Optional. Left empty the key renders nothing, so a public image (or a node
# that is already authenticated) does not need a bogus pull secret.
#
# [!] ghcr.io/kinremtus/mediatracker is currently PRIVATE and the token in
# the ghcr-auth secret is dead: kubelet gets `403 Forbidden` on the oauth
# token endpoint, which is what took prod down on 2026-09-26. Two ways out:
#   a) make the package public (package settings -> Change visibility) and
#      leave this empty - nothing left to rotate, which is what the chart
#      assumes; or
#   b) keep it private: set imagePullSecrets: [{name: ghcr-auth}] and refresh
#      that secret with a PAT that carries read:packages.
imagePullSecrets: []

# The app never calls the Kubernetes API, so it gets a dedicated
# ServiceAccount with no mounted token instead of the namespace default.
serviceAccount:
  create: true
  name: app
  automountServiceAccountToken: false

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

app:
  name: app
  port: 8080

# Exactly one process may run the background loops. The web Deployment disables
# them through the configmap; the dedicated refresh Deployment
# (templates/refresh-deployment.yaml) enables them.
refreshDeployment:
  enabled: true
  replicas: 1
  # Interval for the release-schedule/Telegram loop inside the worker.
  intervalSecs: "1800"
  # Explicit requests: without them the container inherits the LimitRange
  # defaultRequest (100m), which this node cannot afford.
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

# Time the kubelet gives in-flight requests to drain before SIGKILL.
terminationGracePeriodSeconds: 30

envFrom:
  - configMapRef:
      name: app-config
  - secretRef:
      name: app-secret

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# Gives a slow first boot (migrations, connection-pool warm-up) room to finish
# before liveness starts counting failures. Without it a long startup can be
# killed by the liveness probe.
startupProbe:
  httpGet:
    path: /health
    port: 8080
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30

resources:
  limits:
    memory: 512Mi
    cpu: 500m
  requests:
    memory: 128Mi
    # 50m, not 100m: on a 1-vCPU node three pods' worth of requests decide
    # whether a rolling update schedules or sits Pending.
    cpu: 50m

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

podSecurityContext:
  runAsNonRoot: true

tmpVolume:
  enabled: true
  mountPath: /tmp

configMap:
  host: "0.0.0.0"
  rustLog: "info"
  appBaseUrl: ""
  emailFrom: ""
  # Background loops run only in the dedicated refresh Deployment (below), so
  # the web pods disable both. Otherwise every HPA-scaled replica would run the
  # provider metadata refresh and the release-schedule/Telegram loop.
  refreshLoopEnabled: "false"
  refreshIntervalSecs: "0"

# ---------------------------------------------------------------------------
# PostgreSQL, templated by templates/postgres-statefulset.yaml.
#
# Adopting the existing (kubectl-applied) objects into this release: label and
# annotate them once, then a normal `helm upgrade` takes ownership:
#   kubectl -n mediatracker annotate statefulset postgres \
#     meta.helm.sh/release-name=app meta.helm.sh/release-namespace=mediatracker
#   kubectl -n mediatracker label statefulset postgres app.kubernetes.io/managed-by=Helm
#   kubectl -n mediatracker annotate service postgres \
#     meta.helm.sh/release-name=app meta.helm.sh/release-namespace=mediatracker
#   kubectl -n mediatracker label service postgres app.kubernetes.io/managed-by=Helm
#
# `storage`/`storageClassName` must match the live volumeClaimTemplates: that
# block is immutable on an existing StatefulSet, so a changed value makes the
# upgrade fail. The PVC itself is created by the StatefulSet (not tracked by
# Helm) and is never deleted by `helm uninstall`.
# ---------------------------------------------------------------------------
postgres:
  enabled: true
  image:
    repository: postgres
    tag: 17-alpine
    # Digest pins the exact image bytes (linux/amd64+arm64 manifest list),
    # so a re-pushed/compromised 17-alpine tag cannot silently change our DB image.
    # Refresh with: skopeo inspect docker://docker.io/library/postgres:17-alpine | jq -r .Digest
    digest: sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    pullPolicy: IfNotPresent
  port: 5432
  secretName: db-secret
  storageClassName: local-path
  storage: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# Rolling-update safety: keep enough history to roll back to a good image.
revisionHistoryLimit: 5
# How long a rollout may make no progress before it is marked failed.
progressDeadlineSeconds: 600

# Default-deny + allow-list, templated by templates/networkpolicy.yaml.
# Adoption note (run once if the raw k8s/networkpolicy.yaml was ever applied):
#   for n in default-deny allow-dns-egress allow-intra-namespace \
#            allow-app-ingress allow-app-egress-internet allow-backup-egress-internet; do
#     kubectl -n mediatracker annotate networkpolicy "$n" \
#       meta.helm.sh/release-name=app meta.helm.sh/release-namespace=mediatracker
#     kubectl -n mediatracker label networkpolicy "$n" app.kubernetes.io/managed-by=Helm
#   done
networkPolicy:
  enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  # Disabled: the node has 1 vCPU, so scale-up cannot be scheduled, and an
  # HPA ramp during a rollout is what pushed pods into Pending. Two static
  # replicas + PDB minAvailable 1 keep drains safe. Re-enable when VPS1 grows.
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPU: 70

# ---------------------------------------------------------------------------
# Namespace-wide guardrails, templated by templates/resourcequota.yaml.
#
# These used to be a loose k8s/resourcequota.yaml, which the CI deploy never
# applied (it applies only k8s/<dir>/ directories) - so the namespace ran
# without any quota in practice. Sizing must survive the worst case
# (autoscaling disabled: replicaCount 2) plus the Postgres StatefulSet, the
# refresh worker and one backup Job:
#
#   limits:  2x app 500m/512Mi + postgres 1000m/1Gi
#            + refresh 250m/256Mi + backup 500m/256Mi  ~= 2.8 CPU / 2.5Gi
#
# hence limits.cpu/limits.memory = 6 with headroom. requests stay low because
# the node is small; pods/PVCs simply cap runaway fan-out.
#
# Adoption note (only if the old raw file was ever applied by hand, otherwise
# Helm creates both objects itself): annotate and label them once, then a
# normal upgrade takes ownership:
#   kubectl -n mediatracker annotate resourcequota mediatracker-quota \
#     meta.helm.sh/release-name=app meta.helm.sh/release-namespace=mediatracker
#   kubectl -n mediatracker label resourcequota mediatracker-quota \
#     app.kubernetes.io/managed-by=Helm
#   kubectl -n mediatracker annotate limitrange mediatracker-limits \
#     meta.helm.sh/release-name=app meta.helm.sh/release-namespace=mediatracker
#   kubectl -n mediatracker label limitrange mediatracker-limits \
#     app.kubernetes.io/managed-by=Helm
resourceQuota:
  enabled: true
  hard:
    requestsCpu: "2"
    requestsMemory: 2Gi
    limitsCpu: "6"
    limitsMemory: 6Gi
    pods: "20"
    persistentvolumeclaims: "10"
  limitRange:
    default:
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    max:
      cpu: "2"
      memory: 2Gi
