# Two replicas keep the app available during rolling updates and node
# drains: with podDisruptionBudget.minAvailable: 1 a single replica
# would block voluntary evictions (kubectl drain) indefinitely.
replicaCount: 2

image:
  repository: ghcr.io/kinremtus/mediatracker
  tag: latest
  # Immutable per-commit tags (CI passes --set image.tag=$GITHUB_SHA), so
  # IfNotPresent is safe and avoids a registry round-trip on every start.
  pullPolicy: IfNotPresent

# Optional. Left empty the key renders nothing, so a public image (or a node
# that is already authenticated) does not need a bogus pull secret.
imagePullSecrets: []

# The app never calls the Kubernetes API, so it gets a dedicated
# ServiceAccount with no mounted token instead of the namespace default.
serviceAccount:
  create: true
  name: app
  automountServiceAccountToken: false

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

app:
  name: app
  port: 8080

# Exactly one process may run the background loops. The web Deployment disables
# them through the configmap; the dedicated refresh Deployment
# (templates/refresh-deployment.yaml) enables them.
refreshDeployment:
  enabled: true
  replicas: 1
  # Interval for the release-schedule/Telegram loop inside the worker.
  intervalSecs: "1800"

# Time the kubelet gives in-flight requests to drain before SIGKILL.
terminationGracePeriodSeconds: 30

envFrom:
  - configMapRef:
      name: app-config
  - secretRef:
      name: app-secret

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# Gives a slow first boot (migrations, connection-pool warm-up) room to finish
# before liveness starts counting failures. Without it a long startup can be
# killed by the liveness probe.
startupProbe:
  httpGet:
    path: /health
    port: 8080
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30

resources:
  limits:
    memory: 512Mi
    cpu: 500m
  requests:
    memory: 128Mi
    cpu: 100m

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

podSecurityContext:
  runAsNonRoot: true

tmpVolume:
  enabled: true
  mountPath: /tmp

configMap:
  host: "0.0.0.0"
  rustLog: "info"
  appBaseUrl: ""
  emailFrom: ""
  # Background loops run only in the dedicated refresh Deployment (below), so
  # the web pods disable both. Otherwise every HPA-scaled replica would run the
  # provider metadata refresh and the release-schedule/Telegram loop.
  refreshLoopEnabled: "false"
  refreshIntervalSecs: "0"

# ---------------------------------------------------------------------------
# PostgreSQL, templated by templates/postgres-statefulset.yaml.
#
# Adopting the existing (kubectl-applied) objects into this release: label and
# annotate them once, then a normal `helm upgrade` takes ownership:
#   kubectl -n mediatracker annotate statefulset postgres \
#     meta.helm.sh/release-name=app meta.helm.sh/release-namespace=mediatracker
#   kubectl -n mediatracker label statefulset postgres app.kubernetes.io/managed-by=Helm
#   kubectl -n mediatracker annotate service postgres \
#     meta.helm.sh/release-name=app meta.helm.sh/release-namespace=mediatracker
#   kubectl -n mediatracker label service postgres app.kubernetes.io/managed-by=Helm
#
# `storage`/`storageClassName` must match the live volumeClaimTemplates: that
# block is immutable on an existing StatefulSet, so a changed value makes the
# upgrade fail. The PVC itself is created by the StatefulSet (not tracked by
# Helm) and is never deleted by `helm uninstall`.
# ---------------------------------------------------------------------------
postgres:
  enabled: true
  image:
    repository: postgres
    tag: 17-alpine
    # Digest pins the exact image bytes (linux/amd64+arm64 manifest list),
    # so a re-pushed/compromised 17-alpine tag cannot silently change our DB image.
    # Refresh with: skopeo inspect docker://docker.io/library/postgres:17-alpine | jq -r .Digest
    digest: sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    pullPolicy: IfNotPresent
  port: 5432
  secretName: db-secret
  storageClassName: local-path
  storage: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# Rolling-update safety: keep enough history to roll back to a good image.
revisionHistoryLimit: 5
# How long a rollout may make no progress before it is marked failed.
progressDeadlineSeconds: 600

# Default-deny + allow-list, templated by templates/networkpolicy.yaml.
# Adoption note (run once if the raw k8s/networkpolicy.yaml was ever applied):
#   for n in default-deny allow-dns-egress allow-intra-namespace \
#            allow-app-ingress allow-app-egress-internet allow-backup-egress-internet; do
#     kubectl -n mediatracker annotate networkpolicy "$n" \
#       meta.helm.sh/release-name=app meta.helm.sh/release-namespace=mediatracker
#     kubectl -n mediatracker label networkpolicy "$n" app.kubernetes.io/managed-by=Helm
#   done
networkPolicy:
  enabled: true

podDisruptionBudget:
  enabled: true
  minAvailable: 1

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPU: 70
