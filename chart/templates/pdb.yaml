{{- if .Values.podDisruptionBudget.enabled }}
# Keeps at least one app pod up during voluntary disruptions (node drain,
# cluster upgrade). Without this a single-replica Deployment can be evicted and
# the service goes dark.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Values.app.name }}
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app: {{ .Values.app.name }}
{{- end }}
