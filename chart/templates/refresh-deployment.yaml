{{- if .Values.refreshDeployment.enabled }}
# Dedicated single-replica workload that owns the background refresh +
# Telegram notification loop (REFRESH_LOOP_ENABLED=true). It runs the same
# image as the web Deployment but is intentionally NOT selected by the
# Service, so it receives no HTTP traffic. Keeping it separate means the web
# Deployment can scale with the HPA without N replicas racing the loop.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}-refresh
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.refreshDeployment.replicas }}
  strategy:
    # Two refresh pods must never overlap: Recreate tears the old one down
    # before starting the new one.
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Values.app.name }}-refresh
  template:
    metadata:
      labels:
        app: {{ .Values.app.name }}-refresh
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: refresh
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            {{- toYaml .Values.envFrom | nindent 12 }}
          env:
            # Worker-only: no HTTP listener, hence no ports or probes. Both
            # loops are enabled here and disabled in the web Deployment.
            - name: SERVE_HTTP
              value: "false"
            - name: REFRESH_LOOP_ENABLED
              value: "true"
            - name: REFRESH_INTERVAL_SECS
              value: {{ .Values.refreshDeployment.intervalSecs | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- with .Values.tmpVolume }}
          volumeMounts:
            - name: tmp
              mountPath: {{ .mountPath }}
          {{- end }}
      {{- with .Values.tmpVolume }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- end }}
{{- end }}
