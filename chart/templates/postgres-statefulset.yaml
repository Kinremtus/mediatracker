{{- if .Values.postgres.enabled }}
# Postgres now lives in the chart so the StatefulSet, its headless Service and
# the PVC share one source of truth with the app that talks to them.
#
# Data safety: the PVC is created by the StatefulSet's volumeClaimTemplates, so
# Helm does NOT track it and will NOT delete it on `helm uninstall`. Deleting a
# StatefulSet never deletes its PVCs. The volume therefore outlives the release.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
  labels:
    app: postgres
spec:
  # Headless Service: gives the single pod a stable DNS name (postgres).
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: {{ .Values.postgres.port }}
      targetPort: {{ .Values.postgres.port }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # postgres:17-alpine runs as uid/gid 70 (the `postgres` user). fsGroup
      # makes the local-path PVC group-writable for that user.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.postgres.port }}
          envFrom:
            - secretRef:
                name: {{ .Values.postgres.secretName }}
          # pg_isready exec probes. db-secret exposes PGUSER/PGDATABASE
          # (POSTGRES_USER/POSTGRES_DB are accepted fallbacks) so both names are
          # tried to keep the probe working regardless of the key set.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  pg_isready -U "${POSTGRES_USER:-${PGUSER:-postgres}}"
                  -d "${POSTGRES_DB:-${PGDATABASE:-postgres}}"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  pg_isready -U "${POSTGRES_USER:-${PGUSER:-postgres}}"
                  -d "${POSTGRES_DB:-${PGDATABASE:-postgres}}"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
        storageClassName: {{ .Values.postgres.storageClassName }}
{{- end }}
