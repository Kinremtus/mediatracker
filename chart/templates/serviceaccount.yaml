{{- if .Values.serviceAccount.create }}
# The app talks only to Postgres and external HTTP providers; it never calls
# the Kubernetes API. A dedicated ServiceAccount with
# automountServiceAccountToken=false means no API token is projected into the
# pod, so a compromised process cannot use the default SA's credentials.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
