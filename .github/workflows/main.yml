name: CI

# Least privilege by default; the build job raises it to push the image.
permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mediatracker

jobs:
  check:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: clippy
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --locked
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
        with:
          tool: cargo-audit
      - name: cargo audit
        # RUSTSEC-2023-0071 (rsa 0.9.10, Marvin Attack): unfixed advisory in
        # sqlx-mysql, an optional sqlx backend this project never builds
        # (PostgreSQL only) - absent from the build graph (`cargo tree -i rsa`).
        run: cargo audit --ignore RUSTSEC-2023-0071
      - name: Validate K8s YAML
        run: python3 scripts/validate-k8s-yaml.py
      - name: Lint Helm chart
        run: |
          helm lint chart/
          helm template app chart/ --namespace mediatracker >/dev/null

  build:
    needs: [check]
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Lowercase repo
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}:latest

      # Advisory image scan: reports HIGH/CRITICAL CVEs but does not block the
      # pipeline (base-image CVEs would otherwise freeze every deploy).
      # Runs the scanner container directly instead of trivy-action: the action
      # is a composite that pulls aquasecurity/setup-trivy@v0.2.1, a tag that no
      # longer exists after the 2025 tag cleanup, and an unresolvable nested
      # action aborts the job at "Set up job" where continue-on-error cannot
      # help. 0.74.0 is the scanner release, not an action ref.
      - name: Scan image with Trivy
        continue-on-error: true
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm \
            -e TRIVY_USERNAME -e TRIVY_PASSWORD \
            aquasecurity/trivy:0.74.0 image \
              --format table \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 0 \
              "${REGISTRY}/${REPO_LOWER}:${GITHUB_SHA}"

  deploy:
    needs: [build]
    runs-on: self-hosted
    steps:
      - name: Lowercase repo
        run: echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 120m
          script: |
            set -euo pipefail
            cd ${{ secrets.TARGET_DIR }}

            git fetch origin main
            git reset --hard origin/main
            echo "Synced to: $(git rev-parse --short HEAD)"

            # APP_HOST приходит из GitHub Secrets (домен не хранится в репозитории)
            export APP_HOST="${{ secrets.APP_HOST }}"
            command -v envsubst >/dev/null || sudo apt-get install -y gettext-base

            sudo kubectl apply -f k8s/traefik-helm-config.yaml
            envsubst < k8s/ingress.yaml | sudo kubectl apply -f -

            # Apply static k8s manifest directories only if they exist, so a
            # removed/renamed dir never aborts the deploy under `set -euo pipefail`.
            # Monitoring is NOT applied here: it lives in terraform/monitoring/.
            for dir in k8s/cloudflared; do
              [ -d "$dir" ] || continue
              sudo kubectl apply -f "$dir"
            done
            # Templated manifests last: substitute $APP_HOST into the configmap.
            envsubst < k8s/cloudflared/configmap.yaml | sudo kubectl apply -f -

            # Apply SOPS/age-encrypted secrets BEFORE helm: on a clean cluster
            # envFrom.secretRef would otherwise reference a non-existent Secret.
            # Existence-guarded so deploys keep working before bootstrap.
            if [ -d k8s/secrets ] && ls k8s/secrets/*.enc.yaml >/dev/null 2>&1; then
              command -v sops >/dev/null || { echo "sops missing on host; cannot apply encrypted secrets" >&2; exit 1; }
              export SOPS_AGE_KEY_FILE="${SOPS_AGE_KEY_FILE:-$HOME/.config/sops/age/keys.txt}"
              sudo kubectl get namespace mediatracker >/dev/null 2>&1 || sudo kubectl create namespace mediatracker
              for f in k8s/secrets/*.enc.yaml; do
                echo "applying $f"
                sops --decrypt "$f" | sudo kubectl apply -n mediatracker -f -
              done
            else
              echo "no encrypted secrets to apply (k8s/secrets/*.enc.yaml absent)"
            fi

            # --atomic: roll back automatically if the rollout does not become
            # ready within the timeout, instead of leaving a broken release.
            sudo helm --kubeconfig /etc/rancher/k3s/k3s.yaml upgrade --install app chart/ --namespace mediatracker --create-namespace --atomic --timeout 10m --set image.tag=${{ github.sha }} --set configMap.appBaseUrl=https://$APP_HOST --set configMap.emailFrom="MediaTracker <no-reply@$APP_HOST>"

            # Post-deploy smoke check. --atomic only watches Kubernetes
            # readiness: a pod can be Ready while the app answers 500, or the
            # Tunnel/ingress can be broken. Fail the job instead of reporting
            # a green deploy that left prod down.
            ok=0
            for _ in $(seq 1 30); do
              if curl -fsS --max-time 5 "https://$APP_HOST/health" >/dev/null; then
                ok=1
                break
              fi
              sleep 5
            done
            if [ "$ok" != "1" ]; then
              echo "post-deploy health check FAILED: https://$APP_HOST/health"
              exit 1
            fi
            echo "post-deploy health check OK"
